[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-seg-demo"
version = "0.1.0"
description = "Minimal inference demo for five AnimeSeg architectures"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "torchvision",
    "transformers==5.0.0",
    "timm>=1.0.19,<1.1",
    "huggingface-hub>=1,<2",
    "safetensors>=0.5",
    "numpy>=1.26",
    "Pillow>=10",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["anime_seg_demo*"]
